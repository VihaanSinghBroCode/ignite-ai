name: Feature request
description: Suggest an idea or an improvement to the apps Ignite builds.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the goal or the problem rather than a specific solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working, with example commands or prompts if you have them.
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried already?
